<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redstone World · First Person</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div class="space-load-overlay" id="space-load">
    <div
      aria-label="Loading space"
      aria-valuemax="100"
      aria-valuemin="0"
      aria-valuenow="13"
      class="space-load-bar"
      role="progressbar"
    >
      <span></span>
    </div>
  </div>

  <div id="crosshair">+</div>

  <div id="blocker"><div class="panel">
    <h1>Redstone World</h1>
    <p>Click to enter · First person</p>
    <small>WASD move · Space up · Shift down<br>Left click break · Right click place · Scroll/1-9 select block<br>⋯ opens Inventory · Esc cancels placement</small>
  </div></div>

  <button id="to-arena" type="button">Build Arena</button>

  <div id="hud">
    <div id="held"></div>
    <div id="hotbar"></div>
  </div>

  <div hidden id="inventory-overlay">
    <div aria-label="Inventory" class="inventory-dialog" role="dialog">
      <h2>Inventory</h2>
      <p class="empty-state">No saved builds</p>
      <ul class="inventory-list"></ul>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
